<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#121212;
    color:white;
    margin:0;
    padding:20px;
}

.profile-card{
    max-width:600px;
    margin:30px auto;
    background:#181818;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    background:#1DB954;
    color:white;
    font-size:50px;
    line-height:130px;
    margin:auto;
    font-weight:bold;
}

.profile-img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #1DB954;
}

h1{
    color:#1DB954;
    margin-top:15px;
}

.email{
    color:#ccc;
    margin-bottom:15px;
}

.badge{
    display:inline-block;
    background:#1DB954;
    color:white;
    padding:6px 15px;
    border-radius:20px;
    font-size:14px;
    margin-bottom:20px;
}

.stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-top:25px;
}

.stat-box{
    background:#282828;
    padding:15px;
    border-radius:10px;
    width:140px;
}

.stat-box h3{
    margin:0;
    color:#1DB954;
}

.btn{
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    background:#1DB954;
    color:white;
    text-decoration:none;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-size:15px;
}

.btn:hover{
    background:#18a74a;
}

input[type="file"]{
    margin-top:15px;
    color:white;
}

form{
    margin-top:15px;
}

</style>

</head>
<body>

<div class="profile-card">

    {% if profile_pic %}

    <img src="{{ url_for('static',
    filename='profile_pics/' + profile_pic[0]) }}"
    class="profile-img">

    {% else %}

    <div class="avatar">
        {{ user[0][0].upper() }}
    </div>

    {% endif %}

    <h1>{{ user[0] }}</h1>

    <p class="email">{{ user[1] }}</p>

    <div class="badge">
        ⭐ Premium User
    </div>

    <form action="/upload_profile"
          method="POST"
          enctype="multipart/form-data">

        <input type="file"
               name="profile_pic"
               required>

        <br>

        <button type="submit" class="btn">
            📷 Upload Photo
        </button>

    </form>

    <div class="stats">

        <div class="stat-box">
            <h3>{{ favorite_count }}</h3>
            <p>❤️ Favorites</p>
        </div>

        <div class="stat-box">
            <h3>{{ playlist_count }}</h3>
            <p>🎵 Playlists</p>
        </div>

        <div class="stat-box">
            <h3>{{ history_count }}</h3>
            <p>🕒 Searches</p>
        </div>

    </div>

    <br>

    <a href="/edit_profile" class="btn">
        ✏️ Edit Profile
    </a>

    <a href="/dashboard" class="btn">
        🏠 Dashboard
    </a>

</div>

</body>
</html>
